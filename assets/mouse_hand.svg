<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80">
  <defs>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFECB3"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
    <linearGradient id="mouseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5a5a7a"/>
      <stop offset="100%" style="stop-color:#3a3a5a"/>
    </linearGradient>
  </defs>

  <!-- Mouse body -->
  <ellipse cx="50" cy="58" rx="28" ry="20" fill="url(#mouseGrad)"/>
  <ellipse cx="50" cy="52" rx="25" ry="17" fill="#6a6a8a"/>

  <!-- Mouse buttons -->
  <rect x="27" y="40" width="18" height="14" rx="4" fill="#7a7a9a"/>
  <rect x="55" y="40" width="18" height="14" rx="4" fill="#7a7a9a"/>

  <!-- Mouse scroll wheel -->
  <rect x="46" y="42" width="8" height="10" rx="3" fill="#4a4a6a"/>

  <!-- Mouse LED glow -->
  <ellipse cx="50" cy="68" rx="8" ry="4" fill="#FF7043" opacity="0.6"/>

  <!-- Paw on top of mouse -->
  <ellipse cx="50" cy="38" rx="38" ry="28" fill="url(#skinGrad)"/>

  <!-- Main paw pad -->
  <ellipse cx="50" cy="45" rx="14" ry="11" fill="#FFAB91"/>

  <!-- Toe beans -->
  <ellipse cx="28" cy="32" rx="8" ry="6" fill="#FFAB91"/>
  <ellipse cx="42" cy="24" rx="8" ry="6" fill="#FFAB91"/>
  <ellipse cx="58" cy="24" rx="8" ry="6" fill="#FFAB91"/>
  <ellipse cx="72" cy="32" rx="8" ry="6" fill="#FFAB91"/>
</svg>
