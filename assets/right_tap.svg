<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <defs>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7043"/>
      <stop offset="100%" style="stop-color:#E64A19"/>
    </linearGradient>
    <linearGradient id="hoodieInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFAB91"/>
      <stop offset="100%" style="stop-color:#FF8A65"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFC107"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFECB3"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF8A80;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FF8A80;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Hamster Hoodie Body - slight tilt right -->
  <g transform="rotate(2, 200, 200)">
    <ellipse cx="200" cy="220" rx="160" ry="130" fill="url(#hoodieGrad)"/>
    <ellipse cx="200" cy="215" rx="145" ry="115" fill="url(#hoodieInner)"/>
  </g>

  <!-- Hoodie Hamster Ears -->
  <ellipse cx="105" cy="92" rx="40" ry="55" fill="url(#hoodieGrad)"/>
  <ellipse cx="305" cy="98" rx="40" ry="55" fill="url(#hoodieGrad)"/>
  <ellipse cx="105" cy="92" rx="28" ry="40" fill="#FFCCBC"/>
  <ellipse cx="305" cy="98" rx="28" ry="40" fill="#FFCCBC"/>

  <!-- Face - slight tilt -->
  <ellipse cx="203" cy="155" rx="85" ry="78" fill="url(#skinGrad)"/>

  <!-- Hair -->
  <path d="M 118 155 Q 118 90 203 85 Q 288 90 288 155 Q 283 120 253 115 Q 223 100 203 105 Q 183 100 153 115 Q 123 120 118 155" fill="url(#hairGrad)"/>
  <path d="M 148 130 Q 158 115 173 125" fill="none" stroke="#F9A825" stroke-width="3"/>
  <path d="M 233 125 Q 248 115 258 130" fill="none" stroke="#F9A825" stroke-width="3"/>
  <ellipse cx="128" cy="160" rx="15" ry="35" fill="url(#hairGrad)"/>
  <ellipse cx="278" cy="160" rx="15" ry="35" fill="url(#hairGrad)"/>

  <!-- Eyes - Focused/determined look -->
  <ellipse cx="168" cy="160" rx="22" ry="28" fill="#5D4037"/>
  <ellipse cx="238" cy="160" rx="20" ry="26" fill="#5D4037"/>
  <!-- Eye color -->
  <ellipse cx="168" cy="165" rx="12" ry="15" fill="#8D6E63"/>
  <ellipse cx="238" cy="165" rx="11" ry="14" fill="#8D6E63"/>
  <ellipse cx="168" cy="168" rx="8" ry="10" fill="#5D4037"/>
  <ellipse cx="238" cy="168" rx="7" ry="9" fill="#5D4037"/>
  <!-- Highlights -->
  <ellipse cx="173" cy="155" rx="6" ry="8" fill="#FFF"/>
  <ellipse cx="243" cy="155" rx="5" ry="7" fill="#FFF"/>
  <circle cx="163" cy="168" r="4" fill="#FFF" opacity="0.6"/>
  <circle cx="233" cy="167" r="3" fill="#FFF" opacity="0.6"/>

  <!-- Blush - more intense on active side -->
  <ellipse cx="133" cy="185" rx="18" ry="11" fill="url(#blushGrad)"/>
  <ellipse cx="273" cy="185" rx="22" ry="14" fill="url(#blushGrad)"/>

  <!-- Mouth - concentrated -->
  <path d="M 188 198 Q 203 210 218 198" stroke="#5D4037" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="113" y1="175" x2="143" y2="180" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>
  <line x1="113" y1="190" x2="143" y2="190" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>
  <line x1="293" y1="175" x2="263" y2="180" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>
  <line x1="293" y1="190" x2="263" y2="190" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Paw - resting -->
  <ellipse cx="90" cy="295" rx="50" ry="35" fill="url(#skinGrad)"/>
  <ellipse cx="90" cy="305" rx="15" ry="12" fill="#FFAB91"/>
  <circle cx="75" cy="290" r="6" fill="#FFAB91"/>
  <circle cx="90" cy="285" r="6" fill="#FFAB91"/>
  <circle cx="105" cy="290" r="6" fill="#FFAB91"/>

  <!-- RIGHT Paw - PRESSING DOWN -->
  <ellipse cx="310" cy="315" rx="50" ry="30" fill="url(#skinGrad)"/>
  <ellipse cx="310" cy="320" rx="15" ry="10" fill="#FFAB91"/>
  <circle cx="295" cy="308" r="5" fill="#FFAB91"/>
  <circle cx="310" cy="305" r="5" fill="#FFAB91"/>
  <circle cx="325" cy="308" r="5" fill="#FFAB91"/>

  <!-- Impact lines for right tap -->
  <line x1="275" y1="330" x2="260" y2="345" stroke="#FF7043" stroke-width="4" stroke-linecap="round"/>
  <line x1="310" y1="338" x2="310" y2="355" stroke="#FF7043" stroke-width="4" stroke-linecap="round"/>
  <line x1="345" y1="330" x2="360" y2="345" stroke="#FF7043" stroke-width="4" stroke-linecap="round"/>
</svg>
