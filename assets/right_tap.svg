<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <!-- Umaru Bongo Cat - Right Tap State -->
  <!-- Orange Hoodie/Hamster Cape -->
  <ellipse cx="200" cy="200" rx="150" ry="120" fill="#FF6B35"/>
  <ellipse cx="200" cy="200" rx="140" ry="110" fill="#FF8C5A"/>

  <!-- Hoodie ears -->
  <ellipse cx="120" cy="100" rx="35" ry="45" fill="#FF6B35"/>
  <ellipse cx="280" cy="100" rx="35" ry="45" fill="#FF6B35"/>
  <ellipse cx="120" cy="100" rx="25" ry="35" fill="#FFB088"/>
  <ellipse cx="280" cy="100" rx="25" ry="35" fill="#FFB088"/>

  <!-- Face - slightly tilted right -->
  <ellipse cx="205" cy="150" rx="80" ry="70" fill="#FFE4C4"/>

  <!-- Hair (blonde) -->
  <ellipse cx="205" cy="110" rx="75" ry="40" fill="#FFD700"/>
  <ellipse cx="155" cy="130" rx="20" ry="30" fill="#FFD700"/>
  <ellipse cx="255" cy="130" rx="20" ry="30" fill="#FFD700"/>

  <!-- Eyes (focused/determined) -->
  <ellipse cx="175" cy="155" rx="18" ry="22" fill="#8B4513"/>
  <ellipse cx="235" cy="155" rx="16" ry="20" fill="#8B4513"/>
  <!-- Eye shine -->
  <ellipse cx="180" cy="150" rx="6" ry="8" fill="#FFF"/>
  <ellipse cx="240" cy="150" rx="5" ry="7" fill="#FFF"/>

  <!-- Blush (more intense when active) -->
  <ellipse cx="145" cy="175" rx="15" ry="8" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="265" cy="175" rx="18" ry="10" fill="#FFB6C1" opacity="0.8"/>

  <!-- Mouth (concentrating) -->
  <path d="M 190 185 Q 205 195 220 185" stroke="#8B4513" stroke-width="3" fill="none"/>

  <!-- Cat whiskers -->
  <line x1="125" y1="170" x2="155" y2="175" stroke="#8B4513" stroke-width="2"/>
  <line x1="125" y1="180" x2="155" y2="180" stroke="#8B4513" stroke-width="2"/>
  <line x1="285" y1="170" x2="255" y2="175" stroke="#8B4513" stroke-width="2"/>
  <line x1="285" y1="180" x2="255" y2="180" stroke="#8B4513" stroke-width="2"/>

  <!-- Left Arm/Paw resting -->
  <ellipse cx="100" cy="280" rx="45" ry="35" fill="#FFE4C4"/>

  <!-- Right Arm/Paw - PRESSING DOWN -->
  <ellipse cx="300" cy="300" rx="45" ry="30" fill="#FFE4C4"/>
  <!-- Impact lines -->
  <line x1="270" y1="320" x2="260" y2="330" stroke="#FF6B35" stroke-width="3"/>
  <line x1="300" y1="325" x2="300" y2="340" stroke="#FF6B35" stroke-width="3"/>
  <line x1="330" y1="320" x2="340" y2="330" stroke="#FF6B35" stroke-width="3"/>

  <!-- Paw pads -->
  <ellipse cx="100" cy="290" rx="12" ry="10" fill="#FFB6C1"/>
  <ellipse cx="300" cy="305" rx="12" ry="8" fill="#FFB6C1"/>
</svg>
