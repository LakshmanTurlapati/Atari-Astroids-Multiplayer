<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <!-- Umaru Bongo Cat - Both Hands Tap State -->
  <!-- Orange Hoodie/Hamster Cape -->
  <ellipse cx="200" cy="200" rx="150" ry="120" fill="#FF6B35"/>
  <ellipse cx="200" cy="200" rx="140" ry="110" fill="#FF8C5A"/>

  <!-- Hoodie ears - slightly bouncing -->
  <ellipse cx="120" cy="95" rx="35" ry="45" fill="#FF6B35"/>
  <ellipse cx="280" cy="95" rx="35" ry="45" fill="#FF6B35"/>
  <ellipse cx="120" cy="95" rx="25" ry="35" fill="#FFB088"/>
  <ellipse cx="280" cy="95" rx="25" ry="35" fill="#FFB088"/>

  <!-- Face - excited! -->
  <ellipse cx="200" cy="148" rx="80" ry="70" fill="#FFE4C4"/>

  <!-- Hair (blonde) - bouncy -->
  <ellipse cx="200" cy="105" rx="75" ry="42" fill="#FFD700"/>
  <ellipse cx="150" cy="125" rx="22" ry="32" fill="#FFD700"/>
  <ellipse cx="250" cy="125" rx="22" ry="32" fill="#FFD700"/>

  <!-- Eyes (excited/sparkly) -->
  <ellipse cx="170" cy="152" rx="20" ry="24" fill="#8B4513"/>
  <ellipse cx="230" cy="152" rx="20" ry="24" fill="#8B4513"/>
  <!-- Eye shine - bigger for excitement -->
  <ellipse cx="176" cy="146" rx="8" ry="10" fill="#FFF"/>
  <ellipse cx="236" cy="146" rx="8" ry="10" fill="#FFF"/>
  <!-- Extra sparkle -->
  <circle cx="164" cy="158" r="3" fill="#FFF"/>
  <circle cx="224" cy="158" r="3" fill="#FFF"/>

  <!-- Blush (very intense) -->
  <ellipse cx="140" cy="172" rx="20" ry="12" fill="#FFB6C1" opacity="0.9"/>
  <ellipse cx="260" cy="172" rx="20" ry="12" fill="#FFB6C1" opacity="0.9"/>

  <!-- Mouth (big happy smile) -->
  <path d="M 175 182 Q 200 205 225 182" stroke="#8B4513" stroke-width="3" fill="none"/>
  <path d="M 185 190 Q 200 198 215 190" fill="#FF6B6B"/>

  <!-- Cat whiskers - vibrating -->
  <line x1="115" y1="165" x2="145" y2="172" stroke="#8B4513" stroke-width="2"/>
  <line x1="115" y1="178" x2="145" y2="178" stroke="#8B4513" stroke-width="2"/>
  <line x1="285" y1="165" x2="255" y2="172" stroke="#8B4513" stroke-width="2"/>
  <line x1="285" y1="178" x2="255" y2="178" stroke="#8B4513" stroke-width="2"/>

  <!-- Left Arm/Paw - PRESSING DOWN -->
  <ellipse cx="100" cy="300" rx="45" ry="30" fill="#FFE4C4"/>
  <!-- Impact lines left -->
  <line x1="70" y1="320" x2="55" y2="335" stroke="#FF6B35" stroke-width="4"/>
  <line x1="100" y1="325" x2="100" y2="345" stroke="#FF6B35" stroke-width="4"/>
  <line x1="130" y1="320" x2="145" y2="335" stroke="#FF6B35" stroke-width="4"/>

  <!-- Right Arm/Paw - PRESSING DOWN -->
  <ellipse cx="300" cy="300" rx="45" ry="30" fill="#FFE4C4"/>
  <!-- Impact lines right -->
  <line x1="270" y1="320" x2="255" y2="335" stroke="#FF6B35" stroke-width="4"/>
  <line x1="300" y1="325" x2="300" y2="345" stroke="#FF6B35" stroke-width="4"/>
  <line x1="330" y1="320" x2="345" y2="335" stroke="#FF6B35" stroke-width="4"/>

  <!-- Paw pads -->
  <ellipse cx="100" cy="305" rx="12" ry="8" fill="#FFB6C1"/>
  <ellipse cx="300" cy="305" rx="12" ry="8" fill="#FFB6C1"/>

  <!-- Excitement effects -->
  <text x="50" y="80" font-size="24" fill="#FFD700">*</text>
  <text x="340" y="80" font-size="24" fill="#FFD700">*</text>
</svg>
