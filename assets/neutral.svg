<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <defs>
    <!-- Gradients for shading -->
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7043"/>
      <stop offset="100%" style="stop-color:#E64A19"/>
    </linearGradient>
    <linearGradient id="hoodieInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFAB91"/>
      <stop offset="100%" style="stop-color:#FF8A65"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFC107"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFECB3"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF8A80;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FF8A80;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Hamster Hoodie Body -->
  <ellipse cx="200" cy="220" rx="160" ry="130" fill="url(#hoodieGrad)"/>
  <ellipse cx="200" cy="215" rx="145" ry="115" fill="url(#hoodieInner)"/>

  <!-- Hoodie Hamster Ears -->
  <ellipse cx="100" cy="95" rx="40" ry="55" fill="url(#hoodieGrad)"/>
  <ellipse cx="300" cy="95" rx="40" ry="55" fill="url(#hoodieGrad)"/>
  <ellipse cx="100" cy="95" rx="28" ry="40" fill="#FFCCBC"/>
  <ellipse cx="300" cy="95" rx="28" ry="40" fill="#FFCCBC"/>

  <!-- Face -->
  <ellipse cx="200" cy="155" rx="85" ry="78" fill="url(#skinGrad)"/>

  <!-- Hair - Blonde with bangs -->
  <path d="M 115 155 Q 115 90 200 85 Q 285 90 285 155 Q 280 120 250 115 Q 220 100 200 105 Q 180 100 150 115 Q 120 120 115 155" fill="url(#hairGrad)"/>
  <!-- Hair bangs detail -->
  <path d="M 145 130 Q 155 115 170 125" fill="none" stroke="#F9A825" stroke-width="3"/>
  <path d="M 230 125 Q 245 115 255 130" fill="none" stroke="#F9A825" stroke-width="3"/>
  <!-- Side hair -->
  <ellipse cx="125" cy="160" rx="15" ry="35" fill="url(#hairGrad)"/>
  <ellipse cx="275" cy="160" rx="15" ry="35" fill="url(#hairGrad)"/>

  <!-- Eyes - Big anime style -->
  <ellipse cx="165" cy="160" rx="22" ry="28" fill="#5D4037"/>
  <ellipse cx="235" cy="160" rx="22" ry="28" fill="#5D4037"/>
  <!-- Eye highlights -->
  <ellipse cx="172" cy="152" rx="8" ry="10" fill="#FFF"/>
  <ellipse cx="242" cy="152" rx="8" ry="10" fill="#FFF"/>
  <circle cx="160" cy="168" r="4" fill="#FFF" opacity="0.6"/>
  <circle cx="230" cy="168" r="4" fill="#FFF" opacity="0.6"/>
  <!-- Eye color (amber/brown) -->
  <ellipse cx="165" cy="165" rx="12" ry="15" fill="#8D6E63"/>
  <ellipse cx="235" cy="165" rx="12" ry="15" fill="#8D6E63"/>
  <ellipse cx="165" cy="168" rx="8" ry="10" fill="#5D4037"/>
  <ellipse cx="235" cy="168" rx="8" ry="10" fill="#5D4037"/>
  <!-- Pupil highlights on top -->
  <ellipse cx="170" cy="155" rx="6" ry="8" fill="#FFF"/>
  <ellipse cx="240" cy="155" rx="6" ry="8" fill="#FFF"/>

  <!-- Blush -->
  <ellipse cx="130" cy="185" rx="20" ry="12" fill="url(#blushGrad)"/>
  <ellipse cx="270" cy="185" rx="20" ry="12" fill="url(#blushGrad)"/>

  <!-- Mouth - Happy cat smile -->
  <path d="M 185 200 Q 200 215 215 200" stroke="#5D4037" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Cat whisker marks (subtle) -->
  <line x1="110" y1="175" x2="140" y2="180" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="190" x2="140" y2="190" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="175" x2="260" y2="180" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>
  <line x1="290" y1="190" x2="260" y2="190" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>

  <!-- Arms/Paws resting on surface -->
  <ellipse cx="90" cy="295" rx="50" ry="35" fill="url(#skinGrad)"/>
  <ellipse cx="310" cy="295" rx="50" ry="35" fill="url(#skinGrad)"/>

  <!-- Paw pads -->
  <ellipse cx="90" cy="305" rx="15" ry="12" fill="#FFAB91"/>
  <ellipse cx="310" cy="305" rx="15" ry="12" fill="#FFAB91"/>
  <!-- Toe beans -->
  <circle cx="75" cy="290" r="6" fill="#FFAB91"/>
  <circle cx="90" cy="285" r="6" fill="#FFAB91"/>
  <circle cx="105" cy="290" r="6" fill="#FFAB91"/>
  <circle cx="295" cy="290" r="6" fill="#FFAB91"/>
  <circle cx="310" cy="285" r="6" fill="#FFAB91"/>
  <circle cx="325" cy="290" r="6" fill="#FFAB91"/>
</svg>
