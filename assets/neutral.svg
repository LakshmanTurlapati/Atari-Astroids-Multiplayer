<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <!-- Umaru Bongo Cat - Neutral State -->
  <!-- Orange Hoodie/Hamster Cape -->
  <ellipse cx="200" cy="200" rx="150" ry="120" fill="#FF6B35"/>
  <ellipse cx="200" cy="200" rx="140" ry="110" fill="#FF8C5A"/>

  <!-- Hoodie ears -->
  <ellipse cx="120" cy="100" rx="35" ry="45" fill="#FF6B35"/>
  <ellipse cx="280" cy="100" rx="35" ry="45" fill="#FF6B35"/>
  <ellipse cx="120" cy="100" rx="25" ry="35" fill="#FFB088"/>
  <ellipse cx="280" cy="100" rx="25" ry="35" fill="#FFB088"/>

  <!-- Face -->
  <ellipse cx="200" cy="150" rx="80" ry="70" fill="#FFE4C4"/>

  <!-- Hair (blonde) -->
  <ellipse cx="200" cy="110" rx="75" ry="40" fill="#FFD700"/>
  <ellipse cx="150" cy="130" rx="20" ry="30" fill="#FFD700"/>
  <ellipse cx="250" cy="130" rx="20" ry="30" fill="#FFD700"/>

  <!-- Eyes (big anime style) -->
  <ellipse cx="170" cy="155" rx="18" ry="22" fill="#8B4513"/>
  <ellipse cx="230" cy="155" rx="18" ry="22" fill="#8B4513"/>
  <!-- Eye shine -->
  <ellipse cx="175" cy="150" rx="6" ry="8" fill="#FFF"/>
  <ellipse cx="235" cy="150" rx="6" ry="8" fill="#FFF"/>

  <!-- Blush -->
  <ellipse cx="140" cy="175" rx="15" ry="8" fill="#FFB6C1" opacity="0.6"/>
  <ellipse cx="260" cy="175" rx="15" ry="8" fill="#FFB6C1" opacity="0.6"/>

  <!-- Mouth (happy) -->
  <path d="M 185 185 Q 200 200 215 185" stroke="#8B4513" stroke-width="3" fill="none"/>

  <!-- Cat whiskers -->
  <line x1="120" y1="170" x2="150" y2="175" stroke="#8B4513" stroke-width="2"/>
  <line x1="120" y1="180" x2="150" y2="180" stroke="#8B4513" stroke-width="2"/>
  <line x1="280" y1="170" x2="250" y2="175" stroke="#8B4513" stroke-width="2"/>
  <line x1="280" y1="180" x2="250" y2="180" stroke="#8B4513" stroke-width="2"/>

  <!-- Arms/Paws resting -->
  <ellipse cx="100" cy="280" rx="45" ry="35" fill="#FFE4C4"/>
  <ellipse cx="300" cy="280" rx="45" ry="35" fill="#FFE4C4"/>

  <!-- Paw pads -->
  <ellipse cx="100" cy="290" rx="12" ry="10" fill="#FFB6C1"/>
  <ellipse cx="300" cy="290" rx="12" ry="10" fill="#FFB6C1"/>
</svg>
