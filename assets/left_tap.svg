<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350">
  <defs>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7043"/>
      <stop offset="100%" style="stop-color:#E64A19"/>
    </linearGradient>
    <linearGradient id="hoodieInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFAB91"/>
      <stop offset="100%" style="stop-color:#FF8A65"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F"/>
      <stop offset="100%" style="stop-color:#FFC107"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFECB3"/>
      <stop offset="100%" style="stop-color:#FFE0B2"/>
    </linearGradient>
    <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF8A80;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FF8A80;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Hamster Hoodie Body - slight tilt left -->
  <g transform="rotate(-2, 200, 200)">
    <ellipse cx="200" cy="220" rx="160" ry="130" fill="url(#hoodieGrad)"/>
    <ellipse cx="200" cy="215" rx="145" ry="115" fill="url(#hoodieInner)"/>
  </g>

  <!-- Hoodie Hamster Ears -->
  <ellipse cx="95" cy="98" rx="40" ry="55" fill="url(#hoodieGrad)"/>
  <ellipse cx="295" cy="92" rx="40" ry="55" fill="url(#hoodieGrad)"/>
  <ellipse cx="95" cy="98" rx="28" ry="40" fill="#FFCCBC"/>
  <ellipse cx="295" cy="92" rx="28" ry="40" fill="#FFCCBC"/>

  <!-- Face - slight tilt -->
  <ellipse cx="197" cy="155" rx="85" ry="78" fill="url(#skinGrad)"/>

  <!-- Hair -->
  <path d="M 112 155 Q 112 90 197 85 Q 282 90 282 155 Q 277 120 247 115 Q 217 100 197 105 Q 177 100 147 115 Q 117 120 112 155" fill="url(#hairGrad)"/>
  <path d="M 142 130 Q 152 115 167 125" fill="none" stroke="#F9A825" stroke-width="3"/>
  <path d="M 227 125 Q 242 115 252 130" fill="none" stroke="#F9A825" stroke-width="3"/>
  <ellipse cx="122" cy="160" rx="15" ry="35" fill="url(#hairGrad)"/>
  <ellipse cx="272" cy="160" rx="15" ry="35" fill="url(#hairGrad)"/>

  <!-- Eyes - Focused/determined look -->
  <ellipse cx="162" cy="160" rx="20" ry="26" fill="#5D4037"/>
  <ellipse cx="232" cy="160" rx="22" ry="28" fill="#5D4037"/>
  <!-- Eye color -->
  <ellipse cx="162" cy="165" rx="11" ry="14" fill="#8D6E63"/>
  <ellipse cx="232" cy="165" rx="12" ry="15" fill="#8D6E63"/>
  <ellipse cx="162" cy="168" rx="7" ry="9" fill="#5D4037"/>
  <ellipse cx="232" cy="168" rx="8" ry="10" fill="#5D4037"/>
  <!-- Highlights -->
  <ellipse cx="167" cy="155" rx="5" ry="7" fill="#FFF"/>
  <ellipse cx="237" cy="155" rx="6" ry="8" fill="#FFF"/>
  <circle cx="157" cy="167" r="3" fill="#FFF" opacity="0.6"/>
  <circle cx="227" cy="168" r="4" fill="#FFF" opacity="0.6"/>

  <!-- Blush - more intense on active side -->
  <ellipse cx="127" cy="185" rx="22" ry="14" fill="url(#blushGrad)"/>
  <ellipse cx="267" cy="185" rx="18" ry="11" fill="url(#blushGrad)"/>

  <!-- Mouth - concentrated -->
  <path d="M 182 198 Q 197 210 212 198" stroke="#5D4037" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="107" y1="175" x2="137" y2="180" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>
  <line x1="107" y1="190" x2="137" y2="190" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>
  <line x1="287" y1="175" x2="257" y2="180" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>
  <line x1="287" y1="190" x2="257" y2="190" stroke="#BCAAA4" stroke-width="2" stroke-linecap="round"/>

  <!-- LEFT Paw - PRESSING DOWN -->
  <ellipse cx="90" cy="315" rx="50" ry="30" fill="url(#skinGrad)"/>
  <ellipse cx="90" cy="320" rx="15" ry="10" fill="#FFAB91"/>
  <circle cx="75" cy="308" r="5" fill="#FFAB91"/>
  <circle cx="90" cy="305" r="5" fill="#FFAB91"/>
  <circle cx="105" cy="308" r="5" fill="#FFAB91"/>

  <!-- Impact lines for left tap -->
  <line x1="55" y1="330" x2="40" y2="345" stroke="#FF7043" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="338" x2="90" y2="355" stroke="#FF7043" stroke-width="4" stroke-linecap="round"/>
  <line x1="125" y1="330" x2="140" y2="345" stroke="#FF7043" stroke-width="4" stroke-linecap="round"/>

  <!-- Right Paw - resting -->
  <ellipse cx="310" cy="295" rx="50" ry="35" fill="url(#skinGrad)"/>
  <ellipse cx="310" cy="305" rx="15" ry="12" fill="#FFAB91"/>
  <circle cx="295" cy="290" r="6" fill="#FFAB91"/>
  <circle cx="310" cy="285" r="6" fill="#FFAB91"/>
  <circle cx="325" cy="290" r="6" fill="#FFAB91"/>
</svg>
